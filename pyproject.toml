[project]
name = "cnpj-lakehouse"
version = "1.0.0"
description = "Local-first CNPJ Data Lakehouse for the public Cadastro Nacional"
requires-python = ">=3.12,<3.15"
dependencies = [
  "dbt-core==1.12.3",
  "dbt-duckdb==1.11.0",
  "duckdb==1.5.5",
  "httpx==0.28.1",
  "prefect==3.8.5",
  "streamlit==1.63.0",
  "typer==0.27.2",
]

[dependency-groups]
dev = [
  "markdown>=3.8,<4",
  "pypdf>=6,<7",
  "pytest==9.1.1",
  "ruff==0.16.6",
  "weasyprint>=68,<69",
]

[project.scripts]
cnpj-lakehouse = "cnpj_lakehouse.cli:app"
cnpj-lakehouse-serve = "cnpj_lakehouse.serve:serve"
cnpj-lakehouse-dashboard = "cnpj_lakehouse.dashboard:serve"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnpj_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"cnpj_lakehouse/cli.py" = ["B008"]
